<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=300">
  <title>DialogBrain Cookie Sync</title>
  <style>
    /* Clean Flat Design */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif;
      width: 340px;
      min-height: 200px;
      padding: 20px;
      background: #f7f8fa;
      color: #4a5568;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: none;
    }

    .header .db-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #fff;
      font-weight: 700;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #2d3748;
    }

    .login-section {
      text-align: center;
      padding: 24px 0;
    }

    .login-section p {
      font-size: 13px;
      color: #718096;
      margin-bottom: 16px;
      font-weight: 500;
    }

    .login-btn {
      display: inline-block;
      padding: 12px 28px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .login-btn:hover {
      opacity: 0.9;
    }

    .login-btn:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    #login-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #login-form input {
      width: 100%;
      padding: 12px 16px;
      background: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      color: #2d3748;
      outline: none;
      transition: all 0.2s ease;
    }

    #login-form input:focus {
    }

    #login-form input::placeholder {
      color: #a0aec0;
    }

    .error-message {
      color: #e53e3e;
      font-size: 12px;
      text-align: left;
      min-height: 16px;
      font-weight: 500;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: #a0aec0;
      font-size: 12px;
      font-weight: 500;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }

    .divider span {
      padding: 0 14px;
    }

    .secondary-btn {
      display: inline-block;
      padding: 10px 20px;
      background: #fff;
      color: #667eea;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .secondary-btn:hover {
      background: #f7f8fa;
    }

    .platform-card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      border: none;
      transition: all 0.2s ease;
    }

    .platform-card:hover {
    }

    .platform-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .platform-name {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 14px;
      color: #2d3748;
    }

    .platform-icon {
      width: 22px;
      height: 22px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .status-connected {
      background: #c6f6d5;
      color: #22543d;
    }

    .status-disconnected {
      background: #fed7d7;
      color: #9b2c2c;
    }

    .status-syncing {
      background: #fefcbf;
      color: #744210;
    }

    .status-not-logged-in {
      background: #e2e8f0;
      color: #718096;
    }

    .platform-info {
      font-size: 12px;
      color: #718096;
      font-weight: 500;
    }

    .sync-btn {
      display: block;
      width: 100%;
      padding: 10px 14px;
      margin-top: 12px;
      background: #edf2f7;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #4a5568;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sync-btn:hover:not(:disabled) {
      background: #e2e8f0;
    }

    .sync-btn:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
    }

    .footer a {
      font-size: 12px;
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .footer a:hover {
      color: #764ba2;
    }

    .logout-btn {
      display: block;
      width: 100%;
      padding: 10px 14px;
      margin-top: 12px;
      background: #fff;
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #718096;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .logout-btn:hover {
      color: #e53e3e;
      background: #fee2e2;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="db-logo">DB</div>
    <h1>DialogBrain Cookie Sync</h1>
  </div>

  <div id="login-section" class="login-section" style="display: none;">
    <p>Login to your DialogBrain account</p>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit" id="login-btn" class="login-btn">Login</button>
      <div id="login-error" class="error-message"></div>
    </form>
    <div class="divider">
      <span>or</span>
    </div>
    <a id="connect-btn" href="http://localhost:3000/" class="secondary-btn" target="_blank">
      Open DialogBrain
    </a>
  </div>

  <div id="main-section" style="display: none;">
    <!-- Instagram Card -->
    <div class="platform-card">
      <div class="platform-header">
        <div class="platform-name">
          <svg class="platform-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.477 2 2 6.477 2 12C2 17.523 6.477 22 12 22C17.523 22 22 17.523 22 12C22 6.477 17.523 2 12 2Z" stroke="#E4405F" stroke-width="1.5"/>
            <path d="M16.5 7.5V7.501M8 12C8 9.791 9.791 8 12 8C14.209 8 16 9.791 16 12C16 14.209 14.209 16 12 16C9.791 16 8 14.209 8 12Z" stroke="#E4405F" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Instagram
        </div>
        <span id="instagram-status" class="status-badge status-not-logged-in">
          Checking...
        </span>
      </div>
      <div id="instagram-info" class="platform-info">
        Last sync: Never
      </div>
      <button id="instagram-sync-btn" class="sync-btn" disabled>
        Sync Now
      </button>
    </div>

    <!-- LinkedIn Card -->
    <div class="platform-card">
      <div class="platform-header">
        <div class="platform-name">
          <svg class="platform-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 8C17.591 8 19.117 8.632 20.243 9.757C21.368 10.883 22 12.409 22 14V21H18V14C18 13.469 17.789 12.961 17.414 12.586C17.039 12.211 16.531 12 16 12C15.469 12 14.961 12.211 14.586 12.586C14.211 12.961 14 13.469 14 14V21H10V14C10 12.409 10.632 10.883 11.757 9.757C12.883 8.632 14.409 8 16 8Z" fill="#0A66C2"/>
            <rect x="2" y="9" width="4" height="12" fill="#0A66C2"/>
            <circle cx="4" cy="4" r="2" fill="#0A66C2"/>
          </svg>
          LinkedIn
        </div>
        <span id="linkedin-status" class="status-badge status-not-logged-in">
          Checking...
        </span>
      </div>
      <div id="linkedin-info" class="platform-info">
        Last sync: Never
      </div>
      <button id="linkedin-sync-btn" class="sync-btn" disabled>
        Sync Now
      </button>
    </div>

    <button id="logout-btn" class="logout-btn">
      Disconnect Account
    </button>
  </div>

  <div class="footer">
    <a id="settings-link" href="http://localhost:3000/settings" target="_blank">Open DialogBrain Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
